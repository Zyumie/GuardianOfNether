name: GuardianOfNether
version: ${version}
main: fr.zyumie.GuardianOfNether.Main
api-version: '1.21'
author: Zyumie (aka AyanoBrz)
website: https://www.youtube.com/@AyanoBrz
description: Just a boss protecting the Nether from visitors who would dare to enter the Nether 🔥
softdepend: [StackMob]

commands:
  guardian-of-nether:
    description: Commandes du Gardien du Nether
    usage: /guardian-of-nether <spawn|reload|nether> [args]
    permission: guardianofnether.spawn
    aliases:
      - gon
      - guardian

  guardian-items:
    description: Donne le plastron du Gardien
    usage: /guardian-items [joueur]
    permission: guardianofnether.items
    aliases:
      - gon-items

permissions:
  guardianofnether.spawn:
    description: Spawner le Gardien du Nether
    default: op

  guardianofnether.reload:
    description: Recharger la config à chaud
    default: op

  guardianofnether.nether:
    description: Gérer le verrou du Nether
    default: op

  guardianofnether.items:
    description: Donner le plastron du Gardien
    default: op