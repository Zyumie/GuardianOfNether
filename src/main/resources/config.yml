#
#  Fichiers de configuration :
#   - Config.yml : configuration principale (ce fichier)
#   - Boss.yml   : boss, phases, attaques, IA et sbires
#   - Nether.yml : verrouillage du Nether
#

General:
  # Vérifie les mises à jour sur Modrinth au démarrage
  check-updates: true

# -----------------------------------------------
# DROP - Plastron donné à la mort du boss
# -----------------------------------------------
Drop:
  Chestplate:
    name: "&cChestplate of Guardian"
    material: DIAMOND_CHESTPLATE
    unbreakable: true
    # Curse of Vanishing : disparaît si le joueur meurt avec
    curse-of-vanishing: true
    trim:
      material: REDSTONE   # REDSTONE, GOLD, EMERALD, etc.
      pattern: SENTRY      # SENTRY, DUNE, COAST, WILD, etc.
    enchants:
      protection: 4
      unbreaking: 3
      mending: 1
      thorns: 3
      blast_protection: 4
      fire_protection: 4
      projectile_protection: 4

# -----------------------------------------------
# PLASTRON - Comportement quand porté
# -----------------------------------------------
Chestplate-Behavior:
  # Effet Glowing permanent quand porté
  glowing: true
  # Empêche de retirer le plastron du slot d'armure
  lock-on-equip: true

# -----------------------------------------------
# PROTECTION CONTENEURS
# Empêche de ranger le plastron dans un coffre, l'enderchest, etc.
# Bloque TOUTES les méthodes : clic, shift-clic, touches 1-9, touche F
# (échange main secondaire), drag, entonnoirs, sacs (bundles)...
# -----------------------------------------------
Container-Protection:
  # false = aucune protection (le plastron peut être rangé partout)
  enabled: true
  # true = bloque TOUS les inventaires externes d'un coup
  #        (ignore la liste blocked-types ci-dessous)
  block-all: false
  # Types d'inventaires bloqués quand block-all est false
  # (noms de l'enum InventoryType : retire une ligne pour autoriser ce type)
  blocked-types:
    - CHEST
    - ENDER_CHEST
    - BARREL
    - SHULKER_BOX
    - HOPPER
    - DROPPER
    - DISPENSER
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - BREWING
    - CRAFTER
    - DECORATED_POT
    - CHISELED_BOOKSHELF
    - LECTERN
    - COMPOSTER
    - JUKEBOX
    - WORKBENCH
    - LOOM
    - CARTOGRAPHY
    - STONECUTTER
    - MERCHANT
    - BEACON
  # Bloque aussi le stockage dans un sac (bundle)
  block-bundles: true
  # Bloque aussi les cadres (item frames) et armor stands
  block-item-frames: true

# -----------------------------------------------
# RÈGLES DU PLASTRON
# -----------------------------------------------
Chestplate-Rules:
  # Autorise l'enchantement (table d'enchantement + enclume)
  # false = enclume et table bloquées pour le plastron
  enchantable: false
  # Autorise la meule (elle retire les enchantements !)
  allow-grindstone: false
  # Autorise l'ajout / le changement de trim (table de forgeron)
  allow-trim: false
  # Autorise l'upgrade en netherite (table de forgeron)
  allow-netherite-upgrade: false

# -----------------------------------------------
# EFFETS À LA MORT DU BOSS
# -----------------------------------------------
On-Death:
  # Vider l'inventaire de tous les joueurs (sauf le plastron du killer)
  clear-inventory: false
  # Vider l'enderchest de tous les joueurs
  clear-enderchest: false
  # Supprimer tous les villageois du serveur
  kill-villagers: false
  # Donner le plastron au killer
  give-chestplate: true

# -----------------------------------------------
# MESSAGES (supporte les codes couleur &)
# Les messages du boss sont dans Boss.yml, ceux du Nether dans Nether.yml
# -----------------------------------------------
Messages:
  chestplate-received: "&aVous avez reçu la &cChestplate of Guardian &a!"
  container-blocked: "&cVous ne pouvez pas stocker la Chestplate of Guardian !"
  remove-blocked: "&cVous ne pouvez pas retirer la Chestplate of Guardian !"
